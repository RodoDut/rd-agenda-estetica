name: Deploy plugin a Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verificar conexión SSH
        run: |
          ssh -p 65002 -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'Conexión OK'"

      - name: Crear carpeta del plugin si no existe
        run: |
          ssh -p 65002 -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p domains/rdtecnobelleza.net/public_html/wp-content/plugins/rdt-centros-core"

      - name: Sync archivos via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='ESTADO_ACTUAL.md' \
            --exclude='TODO.MD' \
            --exclude='*.log' \
            --exclude='.env' \
            -e "ssh -p 65002 -i ~/.ssh/id_rsa" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:domains/rdtecnobelleza.net/public_html/wp-content/plugins/rdt-centros-core/"
